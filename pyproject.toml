[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "gridportfolio"
version = "0.1.0"
description = "An open-source Energy Integration Operating System for connecting energy data, teams, decisions, and execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "GridPortfolio Contributors" }
]
keywords = [
    "energy",
    "energy-markets",
    "data-science",
    "artificial-intelligence",
    "portfolio-management",
    "energy-procurement",
    "machine-learning",
    "agents",
    "analytics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",

    # Data
    "pandas>=2.2,<3.0",
    "polars>=1.20,<2.0",
    "pyarrow>=18.0,<20.0",
    "duckdb>=1.1,<2.0",

    # Machine Learning
    "scikit-learn>=1.6,<2.0",
    "xgboost>=2.1,<4.0",
    "scipy>=1.14,<2.0",

    # Configuration / Utilities
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.28,<1.0",

    # Visualization / Dashboard support
    "plotly>=6.0,<7.0",

    # AI / Agent abstraction
    "openai>=1.60,<3.0",

    # Logging / Observability
    "structlog>=25.1,<26.0"
]


[project.optional-dependencies]

# Development tooling
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pre-commit>=4.0,<5.0"
]

# Notebook / exploratory analysis
notebooks = [
    "jupyter>=1.1,<2.0",
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.10,<4.0",
    "seaborn>=0.13,<1.0"
]

# Optional local dashboard
dashboard = [
    "streamlit>=1.41,<2.0"
]

# Optional PostgreSQL support for production deployments
postgres = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0"
]

# Optional vector search
vector = [
    "chromadb>=0.6,<1.0"
]

# Install everything needed for local development
all = [
    "gridportfolio[dev,notebooks,dashboard,postgres,vector]"
]


[project.scripts]
gridportfolio = "gridportfolio.cli:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "data"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM"
]

ignore = [
    "E501"
]

[tool.ruff.lint.isort]
known-first-party = ["gridportfolio"]


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = [
    "tests/",
    "data/"
]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers"
]
markers = [
    "unit: deterministic unit tests",
    "integration: integration tests",
    "agent: AI agent tests",
    "slow: tests requiring significant compute or external services"
]


[tool.coverage.run]
branch = true
source = ["src/gridportfolio"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING:"
]
show_missing = true
fail_under = 70


[tool.pre-commit]
# Pre-commit configuration is maintained in .pre-commit-config.yaml.
# This section intentionally documents the expected tooling only.